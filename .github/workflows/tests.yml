name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

  schedule:
    - cron: '0 6 * * 1-5'

  workflow_dispatch:

# Supersede in-flight runs on the same branch — the earlier run is testing code
# that has already been replaced.
#
# `event_name` is part of the group on purpose. Scheduled runs execute on the
# default branch, so without it they share a group with pushes to main and a
# push would cancel the 06:00 run — losing the monitoring silently, with no red
# build to show for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # `tsc --noEmit` compiles the suite without producing output, purely to check
  # the types — a renamed page object method, a locator that no longer exists,
  # a fixture that is not registered.
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One job per engine: a failure names the browser directly, and the three
    # run in parallel.
    # `fail-fast: false` keeps the other two running, so a WebKit-only failure
    # is distinguishable from a genuine regression.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
